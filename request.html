<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Request</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; }
    .user-badge {
      font-size: 0.8rem;
      color: #888;
      background: #2a2a2a;
      padding: 4px 12px;
      border-radius: 20px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
      margin-top: 20px;
    }
    input, textarea {
      width: 100%;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #555; }
    textarea { resize: vertical; min-height: 140px; }
    button[type="submit"] {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #0f0f0f;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover { background: #e0e0e0; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled { background: #444; color: #888; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .status.success { color: #6bcf7f; }
    .status.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Submit a Request</h1>
      <div class="user-badge" id="user-badge">Loading...</div>
    </div>

    <form id="request-form">
      <label for="title">Request Title</label>
      <input type="text" id="title" placeholder="Brief summary of your request" required maxlength="120">

      <label for="message">Message</label>
      <textarea id="message" placeholder="Describe your request in detail..." required maxlength="2000"></textarea>

      <button type="submit" id="submit-btn">Send Request</button>
    </form>

    <div class="status" id="status"></div>
  </div>

  <script>
    const email = sessionStorage.getItem('user_email');
    const name  = sessionStorage.getItem('user_name');
    if (!email) window.location.href = 'login.html';

    document.getElementById('user-badge').textContent = email;

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxjxYrYkgjVyPcnp1EkHN1eEShAdfo43RQWRGE8iMC4fnW_MAtj6SNpl5iRejHc6WbA/exec';

    document.getElementById('request-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn    = document.getElementById('submit-btn');
      const status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      status.style.display = 'none';

      const payload = JSON.stringify({
        email:     email,
        name:      name,
        title:     document.getElementById('title').value.trim(),
        message:   document.getElementById('message').value.trim(),
        timestamp: new Date().toISOString()
      });

      // sendBeacon: fire-and-forget, cross-origin, follows redirects
      const sent = navigator.sendBeacon(SCRIPT_URL, new Blob([payload], { type: 'application/json' }));

      setTimeout(function() {
        if (sent) {
          status.textContent = 'Request sent!';
          status.className = 'status success';
          document.getElementById('request-form').reset();
        } else {
          status.textContent = 'Failed to send. Please try again.';
          status.className = 'status error';
        }
        status.style.display = 'block';
        btn.textContent = 'Send Request';
        btn.disabled = false;
      }, 1500);
    });
  </script>
</body>
</html>
