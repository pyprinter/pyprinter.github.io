<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Requests</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 8px; }
    p { color: #888; font-size: 0.95rem; margin-bottom: 32px; }
    .g-signin { display: flex; justify-content: center; }
    .error { margin-top: 20px; color: #ff6b6b; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Submit a Request</h1>
    <p>Sign in with your Google account to continue.</p>
    <div class="g-signin">
      <div id="g_id_onload"
        data-client_id="997874091474-oub3k58f1v27taccjqbqd2ugvf4ndblh.apps.googleusercontent.com"
        data-callback="handleCredential"
        data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
        data-type="standard"
        data-shape="pill"
        data-theme="outline"
        data-text="sign_in_with"
        data-size="large">
      </div>
    </div>
    <div class="error" id="error">Sign-in failed. Please try again.</div>
  </div>

  <script>
    function handleCredential(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        sessionStorage.setItem('user_email', payload.email);
        sessionStorage.setItem('user_name', payload.name || payload.email);
        window.location.href = 'request.html';
      } catch(e) {
        document.getElementById('error').style.display = 'block';
      }
    }
  </script>
</body>
</html>
